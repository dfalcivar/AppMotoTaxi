name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mototaxi/api test
      - run: pnpm --filter @mototaxi/api build
      - run: pnpm --filter @mototaxi/admin test
      - run: pnpm --filter @mototaxi/admin build
      - run: pnpm --filter @mototaxi/site test
      - run: pnpm --filter @mototaxi/site build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run flutter analyze
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
          analyze_status=${PIPESTATUS[0]}
          set -e
          if [ "$analyze_status" -ne 0 ]; then
            while IFS= read -r diagnostic; do
              if [ -n "$diagnostic" ]; then
                echo "::error title=Flutter analyze::$diagnostic"
              fi
            done < "$RUNNER_TEMP/flutter-analyze.log"
          fi
          exit "$analyze_status"
      - run: flutter test
