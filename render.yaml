services:
  - type: web
    name: mototaxi-atacames-api
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mototaxi-atacames-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PASSWORD
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: PUBLIC_WEB_BASE_URL
        value: https://costa-go.com
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"

  - type: web
    name: mototaxi-atacames-admin
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @mototaxi/admin build
    staticPublishPath: ./apps/admin/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mototaxi-atacames-api.onrender.com
      - key: VITE_GOOGLE_MAPS_WEB_API_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_WEB_MAP_ID
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: costa-go-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @mototaxi/site build
    staticPublishPath: ./apps/site/dist
    autoDeployTrigger: commit
    envVars:
      - key: PUBLIC_API_BASE_URL
        value: https://mototaxi-atacames-api.onrender.com
    routes:
      - type: rewrite
        source: /anunciarme/comprobante/*
        destination: /anunciarme/comprobante/index.html
      - type: rewrite
        source: /anunciarme/comprobante
        destination: /anunciarme/comprobante/index.html
      - type: rewrite
        source: /anunciarme/i/*
        destination: /anunciarme/index.html
      - type: rewrite
        source: /anunciarme
        destination: /anunciarme/index.html

databases:
  - name: mototaxi-atacames-db
    plan: basic-1gb
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    region: virginia
    databaseName: mototaxi
    user: mototaxi
    ipAllowList: []
