services:
  - type: web
    name: mototaxi-atacames-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mototaxi-atacames-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false

  - type: web
    name: mototaxi-atacames-admin
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @mototaxi/admin build
    staticPublishPath: ./apps/admin/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mototaxi-atacames-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: mototaxi-atacames-db
    plan: free
    region: virginia
    databaseName: mototaxi
    user: mototaxi
    ipAllowList: []
