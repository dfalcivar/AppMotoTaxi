name: mototaxi_atacames
description: Aplicación móvil de movilidad Costa-Go.
publish_to: "none"
version: 0.12.0+29

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  shared_preferences: ^2.5.3
  geolocator: ^14.0.3
  web_socket_channel: ^3.0.3
  google_maps_flutter: ^2.18.0
  google_maps_flutter_android: ^2.19.12
  google_maps_flutter_platform_interface: ^2.16.0
  google_navigation_flutter: ^0.10.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.3
  sentry_flutter: ^9.25.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/images/costa-go-emblem.png
  adaptive_icon_foreground: assets/images/costa-go-emblem.png
  adaptive_icon_background: "#032B49"
  adaptive_icon_foreground_inset: 18

flutter:
  uses-material-design: true
  assets:
    - assets/images/atacames-login-hero.png
    - assets/images/costa-go-emblem.png
    - assets/images/advertising-placeholder.png
    - assets/images/mototaxi-map-marker.png
