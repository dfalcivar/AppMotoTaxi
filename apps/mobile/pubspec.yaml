name: mototaxi_atacames
description: Aplicación móvil del MVP de Mototaxi Atacames.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  shared_preferences: ^2.5.3
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/atacames-login-hero.png
    - assets/images/mototaxi-atacames-logo.png
