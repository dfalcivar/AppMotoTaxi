<body><main class="card"><div class="mark">🛺</div><h1>Orden de membresía</h1><p>Esta orden debe ser validada por un recaudador autorizado de Costa-Go.</p><a class="button" id="open" href="#">Abrir portal de recaudación</a><p class="hint">No compartas el enlace fuera del punto autorizado. El código caduca automáticamente.</p></main><script>const token=new URLSearchParams(location.search).get('token')||'';const target='https://mototaxi-atacames-admin.onrender.com/?module=memberships&paymentToken='+encodeURIComponent(token);document.querySelector('#open').href=target;</script></body>
